name: Build native Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true
          cache-on-failure: true

      - name: Test native core
        run: cargo test --locked

      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked

      - name: Build native NSIS and MSI installers
        run: cargo packager --release

      - name: Add portable executable
        shell: pwsh
        run: Copy-Item target/release/mdreader.exe "dist/MD-Reader-${{ github.ref_name }}-windows-x64-portable.exe"

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: mdreader-windows-x64
          path: |
            dist/*.exe
            dist/*.msi
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.msi
