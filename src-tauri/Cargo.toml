[package]
name = "mdreader"
version = "0.1.0"
description = "A fast, quiet Markdown reader for Windows"
authors = ["MD Reader Contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "mdreader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
mime_guess = "2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
walkdir = "2"
